<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fade diagnostic</title>
<style>
body{margin:0;padding:20px 16px 60px;background:#EFEDE3;color:#16161A;
     font:400 15px/1.6 -apple-system,"Segoe UI",sans-serif}
h1{font-size:1.1rem;margin:0 0 4px}
p.sub{margin:0 0 20px;color:#555;font-size:.85rem}
table{width:100%;border-collapse:collapse;margin-bottom:24px}
td{padding:10px 8px;border-bottom:1px solid rgba(0,0,0,.14);vertical-align:top}
td:first-child{color:#555;width:46%;font-size:.82rem}
td:last-child{font-weight:600;font-size:.9rem}
.ok{color:#1a7f37}.bad{color:#B3261E}
#demo{height:90px;background:#16161A;color:#EFEDE3;display:grid;place-items:center;
      opacity:0;transform:translateY(26px);
      transition:opacity 1s ease,transform 1s ease;letter-spacing:.2em;font-size:.8rem}
#demo.in{opacity:1;transform:none}
button{width:100%;padding:14px;margin-bottom:20px;background:#16161A;color:#EFEDE3;
       border:0;font:inherit;letter-spacing:.15em;text-transform:uppercase;font-size:.78rem}
#ua{font-size:.7rem;color:#555;word-break:break-all;line-height:1.5}
#errs{color:#B3261E;font-size:.8rem;white-space:pre-wrap}
.spacer{height:70vh;display:grid;place-items:center;color:#999;font-size:.8rem}
</style>
</head>
<body>

<h1>Fade diagnostic</h1>
<p class="sub">Open this on the iPhone, then screenshot the whole page.</p>

<button id="run">Replay the fade test</button>
<div id="demo">FADE TEST</div>

<table id="out"></table>

<div class="spacer">↓ scroll — the box below should fade in ↓</div>
<div id="demo2" style="height:90px;background:#7F6128;color:#F6F4EC;display:grid;
     place-items:center;opacity:0;transform:translateY(26px);
     transition:opacity 1s ease,transform 1s ease;letter-spacing:.2em;font-size:.8rem">
  SCROLL TEST
</div>

<table id="out2"></table>
<div id="errs"></div>
<p id="ua"></p>

<script>
var errs = [];
window.onerror = function(m, s, l){ errs.push(m + "  (line " + l + ")"); paint(); };

function row(t, label, value, good){
  var tr = t.insertRow();
  tr.insertCell().textContent = label;
  var c = tr.insertCell();
  c.textContent = value;
  if (good === true) c.className = "ok";
  if (good === false) c.className = "bad";
}

var rm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var hasIO = "IntersectionObserver" in window;

var t = document.getElementById("out");
row(t, "prefers-reduced-motion", rm ? "REDUCE  ← this is the cause" : "no-preference", !rm);
row(t, "IntersectionObserver", hasIO ? "supported" : "MISSING", hasIO);
row(t, "CSS transition", (function(){
  var d = document.createElement("div");
  return "transition" in d.style || "webkitTransition" in d.style;
})() ? "supported" : "MISSING", true);
row(t, "Low Power Mode hint", (navigator.getBattery ? "check manually" : "cannot detect"), null);
row(t, "Screen width", window.innerWidth + " px", null);
row(t, "Device pixel ratio", window.devicePixelRatio, null);

/* does a transition actually animate, or does it jump? */
var demo = document.getElementById("demo");
function runDemo(){
  demo.classList.remove("in");
  var samples = [];
  setTimeout(function(){
    demo.classList.add("in");
    var t0 = Date.now();
    var iv = setInterval(function(){
      samples.push(parseFloat(getComputedStyle(demo).opacity).toFixed(2));
      if (Date.now() - t0 > 900){
        clearInterval(iv);
        var uniq = samples.filter(function(v,i,a){ return a.indexOf(v) === i; });
        var animated = uniq.length > 2;
        row(t, "Opacity actually animated?",
            animated ? "YES — " + uniq.length + " steps" : "NO — jumped straight to 1",
            animated);
      }
    }, 60);
  }, 100);
}
document.getElementById("run").addEventListener("click", runDemo);
runDemo();

/* does IntersectionObserver fire on scroll? */
var t2 = document.getElementById("out2");
var fired = false;
if (hasIO){
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (e.isIntersecting && !fired){
        fired = true;
        document.getElementById("demo2").classList.add("in");
        document.getElementById("demo2").style.opacity = 1;
        document.getElementById("demo2").style.transform = "none";
        row(t2, "Observer fired on scroll", "YES", true);
      }
    });
  }, { threshold: 0, rootMargin: "0px 0px -6% 0px" });
  io.observe(document.getElementById("demo2"));
  setTimeout(function(){
    if (!fired) row(t2, "Observer fired on scroll", "NOT YET — scroll down", null);
  }, 3000);
} else {
  row(t2, "Observer fired on scroll", "N/A — not supported", false);
}

function paint(){
  document.getElementById("errs").textContent =
    errs.length ? "JS errors:\n" + errs.join("\n") : "";
}
document.getElementById("ua").textContent = navigator.userAgent;
paint();
</script>
</body>
</html>
